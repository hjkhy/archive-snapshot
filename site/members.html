<script>
const D=JSON.parse(document.getElementById('data').textContent);
const M=D.members, R=D.roles;
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function d(ts){return ts?new Date(ts).toLocaleDateString():'—';}
function days(ts){if(!ts)return '';const x=Math.round((Date.now()-new Date(ts))/864e5);return x+'d';}
function color(c){return (c&&c>0)?'#'+c.toString(16).padStart(6,'0'):'#4e5058';}
const rows=document.getElementById('rows');
function draw(filter){
  const f=(filter||'').toLowerCase().trim(); rows.innerHTML=''; let shown=0;
  Object.values(M).forEach(m=>{
    const hay=[m.username,m.global_name,m.nick,m.id,(m.roles_named||[]).join(' '),m.bot?'bot':''].join(' ').toLowerCase();
    if(f && !hay.includes(f)) return;
    shown++;
    const tr=el('tr');
    const td1=el('td');
    const av=m.avatar_local?el('img','av'):el('div','av');
    if(m.avatar_local){av.src=m.avatar_local;}
    else {av.textContent=(m.username||'?')[0].toUpperCase();av.style.background='#4e5058';av.style.display='inline-block';
          av.style.textAlign='center';av.style.lineHeight='26px';av.style.fontWeight='600';}
    td1.appendChild(av);
    const nm=el('span','nick',m.nick||m.global_name||m.username||m.id);
    td1.appendChild(nm);
    if(m.bot) td1.appendChild(el('span','chip','BOT')).style.background='#5865f2';
    if(m.in_server===false) td1.appendChild(el('span','chip','left')).style.background='#ed4245';
    td1.appendChild(el('div','sub','@'+(m.username||'?')+(m.global_name?(' · '+m.global_name):'')+' · '+m.id));
    tr.appendChild(td1);
    const td2=el('td');
    (m.roles_named||[]).forEach(rn=>{
      const r=R.find(x=>x.name===rn)||{};
      const c=el('span','chip',rn); c.style.background=color(r.color)+'cc';
      if(r.permissions&&r.permissions.length) c.title=r.permissions.join(', ');
      td2.appendChild(c);
    });
    if(!(m.roles_named||[]).length) td2.appendChild(el('span','sub',m.in_server?'—':'not in server'));
    tr.appendChild(td2);
    tr.appendChild(el('td','sub',d(m.joined_at)));
    tr.appendChild(el('td','sub',(m.account_created?d(m.account_created)+' ('+days(m.account_created)+')':'')));
    const tn=el('td','num',String(m.messages||0)); tr.appendChild(tn);
    tr.appendChild(el('td','sub',m.last_seen?new Date(m.last_seen).toLocaleString():'—'));
    rows.appendChild(tr);
  });
  document.getElementById('count').textContent=shown+' / '+Object.keys(M).length+' members';
}
document.getElementById('q').addEventListener('input',e=>draw(e.target.value));
const lg=document.getElementById('legend');
(R||[]).slice().sort((a,b)=>(b.position||0)-(a.position||0)).forEach(r=>{
  const c=el('span','chip',(r.name||'?')+' · '+(r.member_count||0));
  const col=color(r.color); c.style.background=col+'cc';
  c.title=(r.permissions&&r.permissions.length?r.permissions.join(', '):'no permissions')+
          (r.hoist?'\nhoisted (shown separately)':'');
  lg.appendChild(c);
});
draw('');
</script></body></html>
